<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Tự động gửi Origin hợp lệ từ GitHub Pages để tránh lỗi Cloudflare Block -->
    <meta name="referrer" content="origin">
    <title>Rạp Phim Cá Nhân - 47 Tập</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --active-ep: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 12px;
            line-height: 1.5;
        }
        .container { max-width: 1060px; margin: 0 auto; }

        .player-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
            margin-bottom: 14px;
        }
        .player-wrapper iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%; border: none;
        }

        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .current-title { font-size: 1.05rem; font-weight: 700; color: var(--active-ep); }
        .nav-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn:hover:not(:disabled) { background: var(--accent-hover); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-outline {
            background: #334155;
            color: var(--text-main);
        }

        .section-box {
            background: var(--bg-card);
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 16px;
        }
        .section-title {
            font-size: 0.88rem; font-weight: 600; margin-bottom: 12px;
            color: var(--text-muted); text-transform: uppercase;
            display: flex; justify-content: space-between; align-items: center;
        }
        .ep-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(58px, 1fr));
            gap: 8px;
            max-height: 260px;
            overflow-y: auto;
        }
        .ep-btn {
            background: #334155; color: var(--text-main);
            border: 1px solid transparent; padding: 10px 4px;
            border-radius: 6px; cursor: pointer; font-weight: 600;
            font-size: 0.9rem;
        }
        .ep-btn:hover { background: #475569; }
        .ep-btn.watched { color: var(--text-muted); background: #1e293b; border-color: #334155; }
        .ep-btn.active { background: var(--active-ep); color: #052e16; font-weight: 700; }

        details summary {
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }
        textarea {
            width: 100%; height: 120px; margin: 10px 0;
            background: var(--bg-main); color: #fff;
            border: 1px solid #334155; border-radius: 8px;
            padding: 10px; font-family: monospace; font-size: 0.8rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="player-wrapper">
        <iframe id="videoPlayer" src="" allowfullscreen referrerpolicy="origin" allow="autoplay; fullscreen; encrypted-media"></iframe>
    </div>

    <div class="controls-bar">
        <div class="current-title" id="epTitle">Đang tải...</div>
        <div class="nav-buttons">
            <button class="btn" id="prevBtn" onclick="changeEp(-1)">&#8592; Tập trước</button>
            <button class="btn" id="nextBtn" onclick="changeEp(1)">Tập tiếp &#8594;</button>
            <a id="openTabBtn" href="#" target="_blank" rel="opener" class="btn btn-outline">&#8599; Mở Tab Rời</a>
        </div>
    </div>

    <div class="section-box">
        <div class="section-title">
            <span>Danh sách tập (<span id="epCount">47</span>)</span>
        </div>
        <div class="ep-grid" id="epGrid"></div>
    </div>

    <div class="section-box">
        <details>
            <summary>&#9881; Đổi danh sách link phim mới (Lưu ngay trên thiết bị này)</summary>
            <div style="display:flex; gap:8px; margin-top:10px;">
                <input id="currentLinkInput" type="url" placeholder="Dán embed link cho tập đang chọn"
                    style="flex:1; min-width:0; background:var(--bg-main); color:#fff; border:1px solid #334155; border-radius:8px; padding:10px;">
                <button class="btn" onclick="updateCurrentLink()">Đổi link tập này</button>
            </div>
            <textarea id="customLinksInput"></textarea>
            <div style="display:flex; gap:8px;">
                <button class="btn" onclick="saveCustomLinks()">Lưu & Phát Danh Sách Mới</button>
                <button class="btn btn-outline" onclick="resetDefaultLinks()">Khôi phục 47 tập gốc</button>
            </div>
        </details>
    </div>
</div>

<script>

2|https://embed13.streamc.xyz/embed.php?hash=d4f3d1dbd0520c526e40269b8f3022bd

function parseRaw(text) {
    return text.trim().split('\n').map(l => {
        const p = l.split('|');
        return p.length >= 2 ? { ep: p[0].trim(), url: p[1].trim() } : null;
    }).filter(Boolean);
}

let activeRaw = localStorage.getItem('custom_raw_links') || defaultRawLinks;
let episodes = parseRaw(activeRaw);
let currentIndex = 0;
let watchedHistory = JSON.parse(localStorage.getItem('watched_eps') || '[]');

document.getElementById('customLinksInput').value = activeRaw;

function loadEpisode(index) {
    if (index < 0 || index >= episodes.length) return;
    currentIndex = index;
    const item = episodes[currentIndex];

    document.getElementById('videoPlayer').src = item.url;
    document.getElementById('openTabBtn').href = item.url;
    document.getElementById('currentLinkInput').value = item.url;
    document.getElementById('epTitle').textContent = `Đang phát: Tập ${item.ep}`;
    document.getElementById('prevBtn').disabled = (currentIndex === 0);
    document.getElementById('nextBtn').disabled = (currentIndex === episodes.length - 1);

    if (!watchedHistory.includes(item.url)) {
        watchedHistory.push(item.url);
        localStorage.setItem('watched_eps', JSON.stringify(watchedHistory));
    }
    localStorage.setItem('last_ep_index', currentIndex);
    renderGrid();
}

function renderGrid() {
    const grid = document.getElementById('epGrid');
    document.getElementById('epCount').textContent = episodes.length;
    grid.innerHTML = '';
    episodes.forEach((item, index) => {
        const btn = document.createElement('button');
        btn.className = 'ep-btn';
        if (watchedHistory.includes(item.url)) btn.classList.add('watched');
        if (index === currentIndex) btn.classList.add('active');
        btn.textContent = item.ep;
        btn.onclick = () => loadEpisode(index);
        grid.appendChild(btn);
    });
}

function changeEp(step) { loadEpisode(currentIndex + step); }

function updateCurrentLink() {
    const input = document.getElementById('currentLinkInput');
    const newUrl = input.value.trim();

    if (!newUrl) {
        input.focus();
        return;
    }

    try {
        const parsedUrl = new URL(newUrl);
        if (!['http:', 'https:'].includes(parsedUrl.protocol)) throw new Error();
    } catch {
        alert('Embed link không hợp lệ. Vui lòng nhập URL bắt đầu bằng http:// hoặc https://');
        input.focus();
        return;
    }

    episodes[currentIndex].url = newUrl;
    watchedHistory = watchedHistory.filter(url => url !== newUrl);
    const updatedRaw = episodes.map(item => `${item.ep}|${item.url}`).join('\n');
    localStorage.setItem('custom_raw_links', updatedRaw);
    document.getElementById('customLinksInput').value = updatedRaw;
    loadEpisode(currentIndex);
}

function saveCustomLinks() {
    const val = document.getElementById('customLinksInput').value;
    const parsed = parseRaw(val);
    if (parsed.length > 0) {
        localStorage.setItem('custom_raw_links', val);
        episodes = parsed;
        loadEpisode(0);
    }
}

function resetDefaultLinks() {
    localStorage.removeItem('custom_raw_links');
    document.getElementById('customLinksInput').value = defaultRawLinks;
    episodes = parseRaw(defaultRawLinks);
    loadEpisode(0);
}

const savedIndex = parseInt(localStorage.getItem('last_ep_index'), 10);
loadEpisode(!isNaN(savedIndex) && savedIndex < episodes.length ? savedIndex : 0);
</script>
</body>
</html>
